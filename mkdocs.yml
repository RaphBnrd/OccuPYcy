site_name: OccuPYcy Documentation
nav:
  - Home: index.md
  - API Reference: reference.md

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: auto

nav:
  - Home: index.md
  - API Reference:
      - Data: api/data.md
      - Fitting: api/fit.md
      - Models: api/models.md
      - Likelihoods: api/likelihood.md

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js