name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use README as documentation homepage
        run: |
          cp README.md docs/index.md
          cp -R assets docs/assets
          sed -i \
            -e 's#(examples/#(https://github.com/RaphBnrd/OccuPYcy/tree/main/examples/#g' \
            -e 's#](/examples)#](https://github.com/RaphBnrd/OccuPYcy/tree/main/examples)#g' \
            -e 's#(LICENSE)#(https://github.com/RaphBnrd/OccuPYcy/blob/main/LICENSE)#g' \
            -e 's/#-features/#features/g' \
            -e 's/#-installation/#installation/g' \
            -e 's/#%EF%B8%8F-quick-start-example/#quick-start-example/g' \
            -e 's/#-site-occupancy-framework/#site-occupancy-framework/g' \
            -e 's/#-how-to-cite/#how-to-cite/g' \
            -e 's/#-contributing--collaboration/#contributing-collaboration/g' \
            -e 's/#-license/#license/g' \
            -e 's/#-project-links/#project-links/g' \
            docs/index.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install "mkdocs-material" "mkdocstrings[python]"

      - name: Build and publish documentation
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs gh-deploy --force --strict
