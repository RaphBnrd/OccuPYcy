name: Publish package to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/occupycy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Set a unique stable version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pyproject.toml")
          contents = path.read_text()
          run_id = os.environ["GITHUB_RUN_ID"]
          version_match = re.search(r'(?m)^version = "([^"]+)"$', contents)
          if version_match is None:
              raise SystemExit("Could not find the project version in pyproject.toml")
          base_version = version_match.group(1)
          updated, replacements = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{base_version}.{run_id}"',
              contents,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not find the project version in pyproject.toml")
          path.write_text(updated)
          PY

      - name: Build distributions
        run: python -m build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
