[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OccuPYcy"
version = "0.0.0"
description = "Occupancy modeling with maximum likelihood estimation in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
]
authors = [{name = "Raphaël Benerradi"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]